[env:esp32-s3-wroom-1-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Velocità del monitor seriale
monitor_speed = 115200

; --- 1. CONFIGURAZIONE FLASH (16MB) ---
board_upload.flash_size = 16MB
; Usa una tabella delle partizioni pensata per i 16MB (es. per avere spazio per l'OTA o file di grandi dimensioni)
board_build.partitions = default_16MB.csv 

; --- 2. CONFIGURAZIONE PSRAM (8MB Octal) ---
; N16R8 di solito usa Flash in Quad-SPI (qio) e RAM in Octal-SPI (opi)
board_build.arduino.memory_type = qio_opi 

; --- 3. FLAG DI COMPILAZIONE ---
build_flags = 
    -DBOARD_HAS_PSRAM          ; Abilita e inizializza la PSRAM da 8MB all'avvio
    -D ARDUINO_USB_CDC_ON_BOOT=1  ; Abilita la comunicazione USB CDC (Seriale Virtuale) all'avvio
    ; ATTENZIONE ALLA PORTA USB:
    ; Se colleghi la scheda al PC tramite la porta contrassegnata come "USB" (nativa) 
    ; e non tramite la porta "COM/UART", DECOMMENTA la riga seguente togliendo il punto e virgola:
    ; -D ARDUINO_USB_CDC_ON_BOOT=1
