[env:esp32-s3-wroom-1-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Serial Monitor speed
monitor_speed = 115200

; --- 1. FLASH CONFIGURATION (16MB) ---
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; --- 2. PSRAM CONFIGURATION (8MB Octal) ---
; N16R8 uses Flash in Quad-SPI (qio) and RAM in Octal-SPI (opi)
board_build.arduino.memory_type = qio_opi

; --- 3. BUILD FLAGS ---
build_flags = 
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1 ; Ensures Serial.print() works over native USB-C

; --- 4. REQUIRED LIBRARIES ---
lib_deps = 
    adafruit/Adafruit SGP30 Sensor @ ^2.0.2